<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Produto - CD Porta</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg, #E6F3FF, #D0EBFF);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        form {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 320px;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }
        button {
            margin-top: 20px;
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .voltar {
            text-align: center;
            margin-top: 15px;
        }
        .voltar a {
            color: #007bff;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <form method="POST">
        <h2>Cadastrar Produto</h2>
        <label>Nome:</label>
        <input type="text" name="nome" required>

        <label>Quantidade:</label>
        <input type="number" name="quantidade" min="0" required>

        <label>Preço Unitário (R$):</label>
        <input type="number" name="preco_unitario" step="0.01" min="0" required>

        <label>Observação:</label>
        <textarea name="observacao" rows="3"></textarea>

        <button type="submit">Salvar Produto</button>

        <div class="voltar">
            <a href="/painel">← Voltar ao Painel</a>
        </div>
    </form>
</body>
</html>
