<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CD Porta - Sistema de Controle</title>
    <style>
        body {
            font-family: "Poppins", "Segoe UI", sans-serif;
            color:#1f2937;
            background: linear-gradient(135deg, #e8f0ff, #f9fbff, #ffffff);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
        }
        img {
            width: 250px;
            height: auto;
            margin-bottom: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        img:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(0,0,0,0.25);
        }
        h1 {
            font-size: 28px;
            letter-spacing: 0.5px;
            color: #1e3a8a;
            margin-bottom: 30px;
        }
        .botoes {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }
        a {
            text-decoration: none;
        }
        button {
            width: 220px;
            padding: 12px 0;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            transition: background 0.3s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        button:hover {
            background-color: #0056b3;
        }
        .admin-link {
            margin-top: 25px;
            font-size: 14px;
        }
        .admin-link a {
            color: #007bff;
        }
        .admin-link a:hover {
            text-decoration: underline;
        }
        @media (max-width: 600px) {
            h1 { font-size: 20px; }
            img { width: 150px; }
            button { width: 200px; font-size: 15px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="{{ url_for('static', filename='logo.jpeg') }}" alt="Logo CD Porta">

        <h1>Sistema de Controle de Portas Laqueadas - CD Portas</h1>

        <div class="botoes">
            <a href="/estoque"><button>Consultar Estoque</button></a>
         </div>

        <div class="admin-link">
            <a href="/gerente">Área do Gerente</a>
        </div>
    </div>
</body>
</html>
