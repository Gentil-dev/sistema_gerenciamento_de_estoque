<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Gerente - CD Porta</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg, #f5f5f5, #e0e0e0);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            background-color: #007bff;
            color: white;
            width: 100%;
            text-align: center;
            padding: 15px 0;
            font-size: 22px;
            font-weight: bold;
        }
        .menu {
            margin-top: 40px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }
        a {
            text-decoration: none;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            width: 180px;
        }
        button:hover {
            background-color: #0056b3;
        }
        @media (max-width: 600px) {
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        Painel do Gerente - CD Portas
    </header>

    <div class="menu">
        <a href="/cadastro"><button>Cadastrar Produto</button></a>
        <a href="/entrada"><button>Entrada de Produto</button></a>
        <a href="/saida"><button>Saída de Produto</button></a>
        <a href="/excluir"><button>Excluir Produto</button></a>
        <a href="/historico"><button>Histórico</button></a>
        <a href="/estoque"><button>Consultar Estoque</button></a>
        <a href="/logout"><button>Sair</button></a>
    </div>

    <div style="text-align:center; margin-top:100px;">
        <img src="{{ url_for('static', filename='polotransparente.png') }}" 
            alt="Logo CD Porta" 
            style="width:250px; height:auto; margin-bottom:25px; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.2);">
    </div>
</body>
</html>
