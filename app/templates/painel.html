<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Gerente - CD Porta</title>

    <style>  
        body {
            position: relative;
            z-index: 1;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;

            background:               
                linear-gradient(
                    to right,
                    rgba(11, 61, 52, 0.20),   /* verde escuro suave */
                    rgba(11, 61, 52, 0.05),   /* transição */
                    rgba(155, 190, 70, 0.12), /* verde claro suave */
                    rgba(155, 190, 70, 0.08)    /* branco puro */
                );
                                                                 
            background-repeat: no-repeat;
            background-size: 100% 100%;
            background-position: center;
            background-attachment: fixed;
        }

        header {
            background-color: transparent;
            color: #0000FF;
            width: 100%;
            text-align: center;
            padding: 15px 0;
            font-size: 22px;
            font-weight: bold;
        }
        .menu {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }
        a {
            text-decoration: none;
        }
        button {
            background-color: #10815A;
            color: #103927;
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            width: 180px;
        }
        button:hover {
            background-color: #0056b3;
        }
        @media (max-width: 600px) {
            button {
                width: 100%;
            }
        }

        @media (max-width: 600px) {
            body {
                background-size: 100% auto !important; /* força caber na largura */
                background-position: top center !important; /* garante topo */
                background-attachment: scroll !important; /* remove bug mobile */
                padding-top: 20px;

            }
        }
         
        .logo-area {
            background-image: url("{{ url_for('static', filename='polotransparente.png') }}");
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            width: 100%;
            height: min(420px, 40vh);
            margin-top: 15px;
            opacity: 0.93;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }
        

    </style>
</head>
<body>
    <header>
        Painel do Gerente - CD Portas
    </header>

    <div class="menu">
        <a href="/cadastro"><button>Cadastrar Produto</button></a>
        <a href="/entrada"><button>Entrada de Produto</button></a>
        <a href="/saida"><button>Saída de Produto</button></a>
        <a href="/excluir"><button>Excluir Produto</button></a>
        <a href="/historico"><button>Histórico</button></a>
        <a href="/estoque"><button>Consultar Estoque</button></a>
        <a href="/faturamento"><button>Faturamento</button></a>
        <a href="/logout"><button>Sair</button></a>
    </div>
    <div class="logo-area"></div>

</body>
</html>
