<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saída de Produto - CD Porta</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg, #FFD6D6, #FFCCCC);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        form {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 320px;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }
        select, input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }
        button {
            margin-top: 20px;
            width: 100%;
            padding: 10px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #b02a37;
        }
        .voltar {
            text-align: center;
            margin-top: 15px;
        }
        .voltar a {
            color: #007bff;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <form method="POST">
        <h2>Saída de Produto</h2>

        {% if erro %}
            <p style="color: red; font-weight: bold;">
                {{ erro }}
            </p>
        {% endif %}

        <label>Selecione o Produto:</label>
        <select name="produto_id" required>
            {% for produto in produtos %}
                <option value="{{ produto.id }}">{{ produto.nome }}</option>
            {% else %}
                <option disabled>Nenhum produto cadastrado</option>
            {% endfor %}
        </select>

        <label>Quantidade a remover:</label>
        <input type="number" name="quantidade" min="1" required>
        
        <label>Valor total da Saída (R$):</label>
        <input type="number" name="valor" step="0.01" min="0" required>

        <button type="submit">Registrar Saída</button>

        <div class="voltar">
            <a href="/painel">← Voltar ao Painel</a>
        </div>
    </form>
</body>
</html>
